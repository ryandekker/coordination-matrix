# Task Daemon Jobs Configuration
# Copy this file to daemon-jobs.yaml and configure for your environment
#
# Configurable Options:
#   Option          Level           Default                      Description
#   --------------- --------------- ---------------------------- ----------------------------------
#   apiUrl          defaults/job    http://localhost:3001/api    API endpoint URL
#   apiKey          defaults/job    env MATRIX_API_KEY           Authentication key
#   interval        defaults/job    5000                         Polling interval (ms)
#   exec            defaults/job    claude                       Command to execute
#   maxPayloadSize  defaults/job    200000                       Max input payload bytes (~200KB)
#   timeout         defaults/job    600000                       Command timeout in ms (10 min)
#   mcpServers      defaults/job    -                            MCP server definitions (merged)
#   enabled         job only        true                         Whether job runs
#   description     job only        -                            Job description
#   viewId          job only        -                            View/saved search ID
#   strictMcpConfig job only        false                        Only use configured MCP servers
#
# Tool Configuration:
#   Use --allowedTools to give Claude access to tools for real work:
#   - Bash: Execute shell commands (curl, npm, git, etc.)
#   - WebFetch: Fetch URLs (for API calls)
#   - Read/Edit/Write: File operations
#
#   Example: --allowedTools "Bash,WebFetch" enables HTTP requests via curl
#
#   IMPORTANT: With tools enabled, Claude can actually execute work instead
#   of just describing what it would do. Conversation logs (including all tool
#   calls and results) are captured and viewable in the UI under "Conversations".
#
# Usage:
#   node scripts/task-daemon.mjs --config scripts/daemon-jobs.yaml --list
#   node scripts/task-daemon.mjs --config scripts/daemon-jobs.yaml --job <name>
#   node scripts/task-daemon.mjs --config scripts/daemon-jobs.yaml --job <name> --once

# Default settings applied to all jobs (can be overridden per-job)
defaults:
  # Production API URL
  apiUrl: https://your-app.example.com/api

  # API key for authentication (or use MATRIX_API_KEY env var)
  # apiKey: cm_ak_live_xxxxxxxxxxxxx

  # Default polling interval in milliseconds
  interval: 5000

  # Default command to execute (receives task prompt via stdin)
  exec: claude

  # Maximum payload size in bytes (default: 200000 = ~200KB)
  # Tasks with inputPayload larger than this will be held with an error
  maxPayloadSize: 200000

  # Command execution timeout in milliseconds (default: 600000 = 10 minutes)
  # Prevents daemon from hanging indefinitely on stuck tasks
  timeout: 600000

# Define your processing jobs
jobs:
  # Task Router: Lightweight agent that examines new human-created tasks and
  # routes them to the appropriate agent or workflow. Uses Haiku for speed/cost.
  # The router view should filter for:
  #   - creatorType: human
  #   - status: pending
  #   - assigneeId: [<router-agent-id>, __unassigned__]
  # agentId tells the daemon which agent persona to use for unassigned tasks.
  task-router:
    description: Route new human tasks to agents or workflows
    viewId: YOUR_ROUTER_VIEW_ID
    agentId: YOUR_ROUTER_AGENT_ID
    exec: "claude --model claude-haiku-4-5-20251001"
    interval: 3000

  # Example: Content review job using Claude Sonnet
  content-review:
    description: Review and process content tasks
    viewId: YOUR_VIEW_ID_HERE
    exec: "claude --model claude-sonnet-4-20250514"
    interval: 10000

  # Example: Fast triage job using Haiku
  triage:
    description: Quick triage of incoming tasks
    viewId: YOUR_TRIAGE_VIEW_ID
    exec: "claude --model claude-haiku"
    interval: 3000

  # Example: Code analysis with file access
  code-analysis:
    description: Analyze code-related tasks with file access
    viewId: YOUR_CODE_VIEW_ID
    exec: "claude --model claude-sonnet-4-20250514 --allowedTools Edit,Read,Bash"
    interval: 15000

  # Example: API integration agent with HTTP access
  # This agent can ACTUALLY make HTTP requests to external APIs
  api-integration:
    description: Agent that can make real API calls
    viewId: YOUR_API_VIEW_ID
    exec: "claude --model claude-sonnet-4-20250514 --allowedTools Bash"
    # With Bash enabled, Claude can execute curl commands to call APIs
    # Example: curl -X POST https://api.example.com/endpoint -d '{"data": "..."}'
    interval: 10000

  # Example: Templated.io render agent
  # Agent prompt should include Templated API key and docs
  templated-render:
    description: Create image renders via Templated.io API
    viewId: YOUR_TEMPLATED_VIEW_ID
    exec: "claude --model claude-sonnet-4-20250514 --allowedTools Bash"
    # Bash allows curl calls to Templated.io API:
    # curl -X POST https://api.templated.io/v1/render \
    #   -H "Authorization: Bearer $TEMPLATED_API_KEY" \
    #   -H "Content-Type: application/json" \
    #   -d '{"template": "...", "layers": {...}}'
    interval: 10000

  # Example: Job with large payload support
  data-processing:
    description: Process large data tasks
    viewId: YOUR_DATA_VIEW_ID
    exec: "claude --model claude-sonnet-4-20250514"
    maxPayloadSize: 200000  # 200KB - override default for this job

  # Example: Disabled job (won't run)
  legacy-processor:
    enabled: false
    description: Old processor (disabled)
    viewId: OLD_VIEW_ID
    exec: "legacy-command"

  # Example: Job with MCP servers
  # MCP servers give Claude access to external tools and data sources via the
  # Model Context Protocol. The daemon writes the config to a temp file and
  # passes --mcp-config to Claude CLI automatically.
  mcp-enabled-agent:
    description: Agent with MCP server access
    viewId: YOUR_MCP_VIEW_ID
    exec: "claude --model claude-sonnet-4-20250514"
    # MCP servers for this job (merged with defaults.mcpServers)
    mcpServers:
      # HTTP/SSE transport - connect to a remote MCP server
      github:
        type: http
        url: https://api.github.com/mcp
        headers:
          Authorization: "Bearer ${GITHUB_TOKEN}"
      # stdio transport - spawn a local MCP server process
      filesystem:
        type: stdio
        command: npx
        args: ["-y", "@anthropic/mcp-filesystem"]
        env:
          ALLOWED_DIRS: "/tmp/workspace"
    # When true, ONLY these MCP servers are used (ignores ~/.claude.json, .mcp.json, etc.)
    strictMcpConfig: true

# Tips:
# - Create views in the UI that filter tasks by status, tags, or assignee
# - Each job should target a specific view/queue of tasks
# - Use different Claude models based on task complexity:
#   - claude-haiku: Fast, simple tasks (triage, classification)
#   - claude-sonnet: Balanced (most tasks)
#   - claude-opus: Complex reasoning tasks
# - Custom exec commands can be any CLI that accepts prompts via stdin
#
# Tool Tips:
# - --allowedTools "Bash" is the key to enabling real API calls via curl
# - Without tools, Claude can only describe what it WOULD do (hallucination risk)
# - With Bash enabled, Claude can execute real HTTP requests
# - Conversation logs capture ALL tool calls for debugging/auditing
# - View conversation history at /conversations in the UI
#
# MCP Tips:
# - mcpServers at defaults level apply to ALL jobs; job-level overrides per server name
# - Use strictMcpConfig: true to prevent the daemon from using project/user MCP configs
# - Supports http, sse, and stdio transports (same format as Claude Code's .mcp.json)
# - Environment variables in values are expanded by Claude CLI: ${VAR} or ${VAR:-default}
# - Use --dry-run to verify MCP config is being passed correctly
# - MCP servers are initialized per task execution (temp config file, cleaned up after)
